[tool.poetry]
name = "dssat"
version = "4.8.5"
description = "DSSAT Cropping System Model — pure Python implementation"
authors = ["DSSAT Foundation"]
license = "BSD-3-Clause"
readme = "README.md"
packages = [{ include = "dssat" }]
keywords = ["crop model", "agriculture", "simulation", "dssat"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.26"
pandas = "^2.1"
pydantic = "^2.5"
jsonschema = "^4.20"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "*"
mkdocs = "^1.5"
mkdocs-material = "^9.4"
mkdocstrings = {version = "^0.29", extras = ["python"]}
mkdocs-jupyter = "^0.26.3"
matplotlib = "^3.10.9"

[tool.poetry.scripts]
dssat = "dssat.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
